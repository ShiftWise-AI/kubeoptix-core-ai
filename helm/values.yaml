replicaCount: 1

image:
  repository: kubeoptix-core-ai-api
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000

route:
  enabled: true
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    path: /health/live
    periodSeconds: 5
    failureThreshold: 12

env:
  PORT: "8000"
  GRACEFUL_SHUTDOWN_TIMEOUT: "30"
  MARK_DOWN_FILE: "/app/data/report.md"
  KUBEOPTIX_METADATA_DIR: "/app/data/assessment"
  KUBEOPTIX_OUTPUT_DIR: "/app/data/reports"

terminationGracePeriodSeconds: 30
automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

volumes:
  tmp:
    mountPath: /tmp
  data:
    mountPath: /app/data
  logs:
    mountPath: /app/logs
