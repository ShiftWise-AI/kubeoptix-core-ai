# Exemplo de values para instalação em OpenShift.
# Copie este arquivo, ajuste os campos e instale com:
#   ./install.sh -f my-values.yaml
#
# Pré-requisitos:
#   1. Secret Git (nunca colocar o token neste arquivo):
#      oc create secret generic github-auth --from-literal=username=<user> --from-literal=password=<TOKEN> --type=kubernetes.io/basic-auth
#   2. PVC existente harvester-app-data no namespace de destino.
#
# Single-instance: scalePolicy.maxReplicas=1; sem HPA/KEDA.

enabled: true

namespace:
  create: false
  name: shiftwise-ai

image:
  useBuildOutput: true
  repository: default-route-openshift-image-registry.apps-crc.testing/shiftwise-ai/kubeoptix-core-ai
  tag: latest
  pullPolicy: Always

build:
  enabled: true
  git:
    uri: https://github.com/ShiftWise-AI/kubeoptix-core-ai.git
    ref: feature/ocp
    sourceSecret: github-auth
  dockerfilePath: Containerfile
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi

nameOverride: ""
fullnameOverride: ""

service:
  api:
    enabled: true
    name: core-ai-api
    type: ClusterIP
    port: 8000
    targetPort: 8000

scalePolicy:
  enabled: true
  maxReplicas: 1

persistence:
  enabled: true
  existingClaim: harvester-app-data
  mountPath: /app/data
  reportsPath: /app/data/reports

podEnv:
  HOME: /tmp
  KUBECONFIG: /tmp/.kube/config
  KUBEOPTIX_ML_ENABLED: "true"
  TZ: "America/Sao_Paulo"
  LOG_LEVEL: INFO
  PORT: "8000"
  GRACEFUL_SHUTDOWN_TIMEOUT: "30"
  MARK_DOWN_FILE: "/app/data/report.md"
  KUBEOPTIX_METADATA_DIR: "/app/data/assessment"
  KUBEOPTIX_OUTPUT_DIR: "/app/data/reports"
  SYSTEM_SETTINGS_URL: "http://configurations-api:8000/system-settings"

probes:
  enabled: true
  path: /health
  startup:
    path: /health/live
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 12
  readiness:
    path: /health/ready
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    path: /health/live
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2000m"
    memory: "4Gi"

terminationGracePeriodSeconds: 30

# OpenShift restricted SCC: não fixar runAsUser/fsGroup (o cluster atribui o UID do namespace).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
