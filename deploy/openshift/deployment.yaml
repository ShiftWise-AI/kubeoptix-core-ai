apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeoptix-core-ai-api
  labels:
    app.kubernetes.io/name: kubeoptix-core-ai-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: kubeoptix-core-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeoptix-core-ai-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeoptix-core-ai-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: kubeoptix-core-ai
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: kubeoptix-core-ai-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PORT
              value: "8000"
            - name: GRACEFUL_SHUTDOWN_TIMEOUT
              value: "30"
            - name: MARK_DOWN_FILE
              value: "/app/data/report.md"
            - name: KUBEOPTIX_METADATA_DIR
              value: "/app/data/assessment"
            - name: KUBEOPTIX_OUTPUT_DIR
              value: "/app/data/reports"
            - name: SYSTEM_SETTINGS_URL
              value: "http://configurations-api:8000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
