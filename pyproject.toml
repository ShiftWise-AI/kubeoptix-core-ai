[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubeoptix-core-ai"
version = "1.0.0"
description = "Agente local de análise de workloads OpenShift/Kubernetes"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "KubeOptix" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "pydantic>=2.0,<3",
    "PyYAML>=6.0,<7",
    "numpy>=1.26,<3",
    "scikit-learn>=1.3,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "matplotlib>=3.8,<4",
    "Pillow>=10.0,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
]

[project.scripts]
kubeoptix-core-ai = "kubeoptix_core_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kubeoptix_core_ai.visualization.kubediagrams" = ["data/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
