[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubeoptix-core-ai"
version = "0.1.0"
description = "Agente local de análise de workloads OpenShift/Kubernetes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "KubeOptix" }]
dependencies = [
    "pydantic>=2.0,<3",
    "PyYAML>=6.0,<7",
    "numpy>=1.26,<3",
    "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[project.scripts]
kubeoptix-core-ai = "kubeoptix_core_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
